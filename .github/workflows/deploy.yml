name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# GITHUB_TOKEN needs these to publish to Pages via OIDC
permissions:
  contents: read
  pages: write
  id-token: write

# never let two deploys race; let a running one finish
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        # astro:fonts downloads and self-hosts Noto Sans at build time
        run: pnpm build

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
